receivers:
  prometheus/nvidia:
    config:
      scrape_configs:
        - job_name: gpu-nvidia-dcgm
          honor_timestamps: false
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_NVIDIA_HOST:9400"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/mthreads:
    config:
      scrape_configs:
        - job_name: gpu-mthreads
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_MTHREADS_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/iluvatar:
    config:
      scrape_configs:
        - job_name: gpu-iluvatar
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_ILUVATAR_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/hygon:
    config:
      scrape_configs:
        - job_name: gpu-hygon-dcu
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_HYGON_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/muxi:
    config:
      scrape_configs:
        - job_name: gpu-muxi
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_MUXI_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/tsingmicro:
    config:
      scrape_configs:
        - job_name: gpu-tsingmicro
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_TSINGMICRO_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/huawei:
    config:
      scrape_configs:
        - job_name: gpu-huawei-ascend
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_ASCEND_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/kunlunxin:
    config:
      scrape_configs:
        - job_name: gpu-kunlunxin
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_KUNLUNXIN_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

  prometheus/enflame:
    config:
      scrape_configs:
        - job_name: gpu-enflame
          scrape_interval: 30s
          scrape_timeout: 15s
          static_configs:
            - targets: ["REPLACE_WITH_ENFLAME_HOST:21001"]
              labels: {region: "example-region", zone: "example-zone"}

processors:
  filter/nvidia:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^DCGM_FI_DEV_GPU_TEMP$|^DCGM_FI_DEV_POWER_USAGE$|^DCGM_FI_DEV_GPU_UTIL$|^DCGM_FI_DEV_MEM_COPY_UTIL$|^DCGM_FI_DEV_FB_FREE$|^DCGM_FI_DEV_FB_USED$|^DCGM_FI_DEV_XID_ERRORS$")
  metricstransform/nvidia:
    transforms:
      - include: ^DCGM_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: gpu, new_label: dev_id}
          - {action: update_label, label: Hostname, new_label: hostname}
          - {action: update_label, label: modelName, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: nvidia}
      - {include: DCGM_FI_DEV_GPU_TEMP, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: DCGM_FI_DEV_POWER_USAGE, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: DCGM_FI_DEV_GPU_UTIL, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: DCGM_FI_DEV_MEM_COPY_UTIL, match_type: strict, action: update, new_name: gpu_memory_usage_ratio}
      - {include: DCGM_FI_DEV_FB_USED, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: DCGM_FI_DEV_FB_FREE, match_type: strict, action: update, new_name: gpu_memory_free_bytes}
      - {include: DCGM_FI_DEV_XID_ERRORS, match_type: strict, action: update, new_name: gpu_state}

  filter/mthreads:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^mtgpu_gpu_temp$|^mtgpu_power_usage_milliwatts$|^mtgpu_gpu_utilization$|^mtgpu_memory_total_bytes$|^mtgpu_memory_used_bytes$")
  metricstransform/mthreads:
    transforms:
      - include: ^mtgpu_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: index, new_label: dev_id}
          - {action: update_label, label: name, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: mthreads}
      - {include: mtgpu_gpu_temp, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: mtgpu_power_usage_milliwatts, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: mtgpu_gpu_utilization, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: mtgpu_memory_total_bytes, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: mtgpu_memory_used_bytes, match_type: strict, action: update, new_name: gpu_memory_used_bytes}

  filter/iluvatar:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^ix_gpu_temperature$|^ix_power_usage$|^ix_gpu_utilization$|^ix_mem_total$|^ix_mem_used$")
  metricstransform/iluvatar:
    transforms:
      - include: ^ix_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: gpu, new_label: dev_id}
          - {action: update_label, label: name, new_label: gpu_type}
          - {action: update_label, label: node_name, new_label: hostname}
          - {action: add_label, new_label: gpu_vendor, new_value: iluvatar}
      - {include: ix_gpu_temperature, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: ix_power_usage, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: ix_gpu_utilization, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: ix_mem_total, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: ix_mem_used, match_type: strict, action: update, new_name: gpu_memory_used_bytes}

  filter/hygon:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^dcu_temp$|^dcu_power_usage$|^dcu_utilizationrate$|^dcu_memorycap_bytes$|^dcu_usedmemory_bytes$|^dcu_memory_remaining$")
  metricstransform/hygon:
    transforms:
      - include: ^dcu_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: minor_number, new_label: dev_id}
          - {action: update_label, label: name, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: hygon}
      - {include: dcu_temp, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: dcu_power_usage, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: dcu_utilizationrate, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: dcu_memorycap_bytes, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: dcu_usedmemory_bytes, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: dcu_memory_remaining, match_type: strict, action: update, new_name: gpu_memory_free_bytes}

  filter/muxi:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^core_temp$|^bway_power$|^gpu_usage$|^memory_total$|^memory_used$")
      datapoint:
        - metric.name == "bway_power" and attributes["wayId"] != "0"
        - metric.name == "memory_total" and attributes["memType"] != "vram"
        - metric.name == "memory_used" and attributes["memType"] != "vram"
  metricstransform/muxi:
    transforms:
      - include: ^(core_temp|bway_power|gpu_usage|memory_total|memory_used)$
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: deviceId, new_label: dev_id}
          - {action: add_label, new_label: gpu_type, new_value: "Muxi MC550"}
          - {action: add_label, new_label: gpu_vendor, new_value: muxi}
      - {include: core_temp, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: bway_power, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: gpu_usage, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: memory_total, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: memory_used, match_type: strict, action: update, new_name: gpu_memory_used_bytes}

  filter/tsingmicro:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^TSINGMICRO_KUIPER_TEMP$|^TSINGMICRO_KUIPER_POWER_USAGE$|^TSINGMICRO_KUIPER_MEMORY_TOTAL$|^TSINGMICRO_KUIPER_MEMORY_USING$|^TSINGMICRO_KUIPER_UTILIZATION$|^TSINGMICRO_KUIPER_HEALTH_STATUS$")
  metricstransform/tsingmicro:
    transforms:
      - include: ^TSINGMICRO_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: deviceID, new_label: dev_id}
          - {action: update_label, label: cardName, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: tsingmicro}
      - {include: TSINGMICRO_KUIPER_TEMP, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: TSINGMICRO_KUIPER_POWER_USAGE, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: TSINGMICRO_KUIPER_UTILIZATION, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: TSINGMICRO_KUIPER_MEMORY_USING, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: TSINGMICRO_KUIPER_MEMORY_TOTAL, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: TSINGMICRO_KUIPER_HEALTH_STATUS, match_type: strict, action: update, new_name: gpu_state}

  filter/huawei:
    error_mode: ignore
    metrics:
      metric:
        - >-
          not IsMatch(name, "^npu_chip_info_temperature$|^npu_chip_info_power$|^npu_chip_info_health_status$|^npu_chip_info_ai_core_utilization$|^npu_chip_info_hbm_total_memory$|^npu_chip_info_hbm_used_memory$|^npu_chip_info_hbm_utilization$|^npu_chip_info_hbm_temperature$|^npu_chip_info_aicore_current_freq$|^npu_chip_info_bandwidth_rx$|^npu_chip_info_bandwidth_tx$|^npu_chip_info_hbm_bandwidth_utilization$|^machine_npu_nums$")
          and IsMatch(name, "^npu_|^machine_npu_nums$")
  metricstransform/huawei_labels:
    transforms:
      - include: ^(npu_|machine_npu_nums).*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: id, new_label: dev_id}
          - {action: update_label, label: model_name, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: huawei}
  metricstransform/huawei_metrics:
    transforms:
      - {include: npu_chip_info_temperature, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: npu_chip_info_power, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: npu_chip_info_ai_core_utilization, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: npu_chip_info_hbm_total_memory, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: npu_chip_info_hbm_used_memory, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: npu_chip_info_hbm_utilization, match_type: strict, action: update, new_name: gpu_memory_usage_ratio}
      - {include: npu_chip_info_hbm_temperature, match_type: strict, action: update, new_name: gpu_hbm_temperature}
      - {include: npu_chip_info_health_status, match_type: strict, action: update, new_name: gpu_state}
      - {include: npu_chip_info_aicore_current_freq, match_type: strict, action: update, new_name: gpu_clock_mhz}
      - {include: npu_chip_info_bandwidth_rx, match_type: strict, action: update, new_name: gpu_pcie_rx_bytes}
      - {include: npu_chip_info_bandwidth_tx, match_type: strict, action: update, new_name: gpu_pcie_tx_bytes}
      - {include: npu_chip_info_hbm_bandwidth_utilization, match_type: strict, action: update, new_name: gpu_hbm_bandwidth_ratio}

  filter/kunlunxin:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^node_xpu_temp$|^node_xpu_powerUsage$|^node_xpu_utilization$|^node_xpu_memtotal$|^node_xpu_memused$|^node_xpu_memfree$|^node_xpu_memutil$|^node_xpu_state$|^node_xpu_xidCount$|^node_xpu_totalEccCorrectedErrors$|^node_xpu_totalEccUncorrectedErrors$|^node_xpu_xpuLinkState$")
  metricstransform/kunlunxin:
    transforms:
      - include: ^node_xpu_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: card, new_label: dev_id}
          - {action: update_label, label: device, new_label: dev_id}
          - {action: update_label, label: name, new_label: gpu_type}
          - {action: add_label, new_label: gpu_vendor, new_value: kunlunxin}
      - {include: node_xpu_temp, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: node_xpu_powerUsage, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: node_xpu_utilization, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: node_xpu_memtotal, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: node_xpu_memused, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: node_xpu_memfree, match_type: strict, action: update, new_name: gpu_memory_free_bytes}
      - {include: node_xpu_memutil, match_type: strict, action: update, new_name: gpu_memory_usage_ratio}
      - {include: node_xpu_state, match_type: strict, action: update, new_name: gpu_state}
      - {include: node_xpu_xidCount, match_type: strict, action: update, new_name: gpu_xid_errors_total}
      - {include: node_xpu_totalEccCorrectedErrors, match_type: strict, action: update, new_name: gpu_ecc_corrected_errors_total}
      - {include: node_xpu_totalEccUncorrectedErrors, match_type: strict, action: update, new_name: gpu_ecc_uncorrected_errors_total}
      - {include: node_xpu_xpuLinkState, match_type: strict, action: update, new_name: gpu_link_state}

  filter/enflame:
    error_mode: ignore
    metrics:
      metric:
        - not IsMatch(name, "^enflame_gcu_temperatures$|^enflame_gcu_power_consumption$|^enflame_gcu_usage$|^enflame_gcu_memory_total_bytes$|^enflame_gcu_memory_used_bytes$|^enflame_gcu_memory_usage$|^enflame_gcu_health$|^enflame_gcu_clock$|^enflame_gcu_cluster_usage$|^enflame_gcu_sip_usage$|^enflame_gcu_power_capability$|^enflame_gcu_power_usage$|^enflame_gcu_ecc_single_bit_error_total_count$|^enflame_gcu_ecc_double_bit_error_total_count$|^enflame_gcu_exporter_up$|^enflame_gcu_count$")
  metricstransform/enflame:
    transforms:
      - include: ^enflame_gcu_.*
        match_type: regexp
        action: update
        operations:
          - {action: update_label, label: minor_number, new_label: dev_id}
          - {action: update_label, label: name, new_label: gpu_type}
          - {action: update_label, label: host, new_label: hostname}
          - {action: add_label, new_label: gpu_vendor, new_value: enflame}
      - {include: enflame_gcu_temperatures, match_type: strict, action: update, new_name: gpu_temperature}
      - {include: enflame_gcu_power_consumption, match_type: strict, action: update, new_name: gpu_power_usage_watts}
      - {include: enflame_gcu_usage, match_type: strict, action: update, new_name: gpu_utilization_ratio}
      - {include: enflame_gcu_memory_total_bytes, match_type: strict, action: update, new_name: gpu_memory_total_bytes}
      - {include: enflame_gcu_memory_used_bytes, match_type: strict, action: update, new_name: gpu_memory_used_bytes}
      - {include: enflame_gcu_memory_usage, match_type: strict, action: update, new_name: gpu_memory_usage_ratio}
      - {include: enflame_gcu_health, match_type: strict, action: update, new_name: gpu_state}
      - {include: enflame_gcu_clock, match_type: strict, action: update, new_name: gpu_clock_mhz}
      - {include: enflame_gcu_cluster_usage, match_type: strict, action: update, new_name: gpu_cluster_usage_ratio}
      - {include: enflame_gcu_sip_usage, match_type: strict, action: update, new_name: gpu_sip_usage_ratio}
      - {include: enflame_gcu_power_capability, match_type: strict, action: update, new_name: gpu_power_capability_watts}
      - {include: enflame_gcu_power_usage, match_type: strict, action: update, new_name: gpu_power_usage_ratio}
      - {include: enflame_gcu_ecc_single_bit_error_total_count, match_type: strict, action: update, new_name: gpu_ecc_corrected_errors_total}
      - {include: enflame_gcu_ecc_double_bit_error_total_count, match_type: strict, action: update, new_name: gpu_ecc_uncorrected_errors_total}
      - {include: enflame_gcu_exporter_up, match_type: strict, action: update, new_name: gpu_exporter_up}
      - {include: enflame_gcu_count, match_type: strict, action: update, new_name: machine_gpu_count}

  transform/extract_ip_21001:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["ip"], Substring(resource.attributes["service.instance.id"], 0, Len(resource.attributes["service.instance.id"]) - 6)) where resource.attributes["service.instance.id"] != nil

  transform/extract_ip_9400:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["ip"], Substring(resource.attributes["service.instance.id"], 0, Len(resource.attributes["service.instance.id"]) - 5)) where resource.attributes["service.instance.id"] != nil

  transform/common_units:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(value_double, value_double / 100.0) where metric.name == "gpu_utilization_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_memory_usage_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_power_usage_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_cluster_usage_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_sip_usage_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_hbm_bandwidth_ratio" and value_double > 1.0
          - set(value_double, value_double / 1000.0) where metric.name == "gpu_power_usage_watts" and (attributes["gpu_vendor"] == "mthreads" or attributes["gpu_vendor"] == "muxi")
          - set(value_double, value_double * 1048576.0) where (metric.name == "gpu_memory_total_bytes" or metric.name == "gpu_memory_used_bytes" or metric.name == "gpu_memory_free_bytes") and (attributes["gpu_vendor"] == "nvidia" or attributes["gpu_vendor"] == "iluvatar")
          - set(value_double, value_double * 1024.0) where (metric.name == "gpu_memory_total_bytes" or metric.name == "gpu_memory_used_bytes") and attributes["gpu_vendor"] == "muxi"
          - delete_key(attributes, "container")
          - delete_key(attributes, "container_name")
          - delete_key(attributes, "node")
          - delete_key(attributes, "pod")
          - delete_key(attributes, "pod_name")
          - delete_key(attributes, "namespace")
          - delete_key(attributes, "pod_namespace")
          - delete_key(attributes, "wayId")
          - delete_key(attributes, "memType")
          - delete_key(attributes, "slot")

  metricsgeneration/memory_total:
    rules:
      - name: gpu_memory_total_bytes
        type: calculate
        metric1: gpu_memory_used_bytes
        metric2: gpu_memory_free_bytes
        operation: add
        unit: By

  metricsgeneration/memory_usage_ratio:
    rules:
      - name: gpu_memory_usage_ratio
        type: calculate
        metric1: gpu_memory_used_bytes
        metric2: gpu_memory_total_bytes
        operation: divide
        unit: "1"

  batch:
    send_batch_size: 256
    timeout: 10s

exporters:
  otlphttp/prometheus:
    endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
    metrics_endpoint: ${env:PROMETHEUS_OTLP_ENDPOINT}
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 2000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics/nvidia:
      receivers: [prometheus/nvidia]
      processors: [filter/nvidia, metricstransform/nvidia, transform/extract_ip_9400, transform/common_units, metricsgeneration/memory_total, metricsgeneration/memory_usage_ratio, batch]
      exporters: [otlphttp/prometheus]
    metrics/mthreads:
      receivers: [prometheus/mthreads]
      processors: [filter/mthreads, metricstransform/mthreads, transform/extract_ip_21001, transform/common_units, metricsgeneration/memory_usage_ratio, batch]
      exporters: [otlphttp/prometheus]
    metrics/iluvatar:
      receivers: [prometheus/iluvatar]
      processors: [filter/iluvatar, metricstransform/iluvatar, transform/extract_ip_21001, transform/common_units, metricsgeneration/memory_usage_ratio, batch]
      exporters: [otlphttp/prometheus]
    metrics/hygon:
      receivers: [prometheus/hygon]
      processors: [filter/hygon, metricstransform/hygon, transform/extract_ip_21001, transform/common_units, metricsgeneration/memory_usage_ratio, batch]
      exporters: [otlphttp/prometheus]
    metrics/muxi:
      receivers: [prometheus/muxi]
      processors: [filter/muxi, metricstransform/muxi, transform/extract_ip_21001, transform/common_units, metricsgeneration/memory_usage_ratio, batch]
      exporters: [otlphttp/prometheus]
    metrics/tsingmicro:
      receivers: [prometheus/tsingmicro]
