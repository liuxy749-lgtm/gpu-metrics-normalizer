# Enflame / 燧原 S60 template.
#
# Field deployment has verified normalized output:
#   gpu_type: Enflame_S60-48GB
#
# TODO before open-source GA:
#   Add raw S60 exporter sample output and strict metric rename rules.
processors:
  metricstransform/enflame_template:
    transforms:
      - include: ^(s60|enflame).*
        match_type: regexp
        action: update
        operations:
          - {action: add_label, new_label: gpu_vendor, new_value: enflame}
  transform/enflame_units_template:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(value_double, value_double / 100.0) where metric.name == "gpu_utilization_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_memory_usage_ratio" and value_double > 1.0
