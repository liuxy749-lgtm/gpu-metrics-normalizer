# Kunlunxin / 昆仑芯 P800 template.
#
# Field deployment has verified normalized output:
#   gpu_vendor in {"Kunlunxin", "kunlunxin"}
#   gpu_type: P800 OAM
#
# TODO before open-source GA:
#   Add raw xpu-exporter sample output and strict metric rename rules.
processors:
  metricstransform/kunlunxin_template:
    transforms:
      - include: ^(xpu|kunlun|klx).*
        match_type: regexp
        action: update
        operations:
          - {action: add_label, new_label: gpu_vendor, new_value: kunlunxin}
  transform/kunlunxin_units_template:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(value_double, value_double / 100.0) where metric.name == "gpu_utilization_ratio" and value_double > 1.0
          - set(value_double, value_double / 100.0) where metric.name == "gpu_memory_usage_ratio" and value_double > 1.0
